<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>checkout</title>
  <link rel="stylesheet" href="public/css/bootstrap.css" />
  <link rel="stylesheet" href="public/css/bootstrap-icons/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="public/css/style.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
</head>

<body style="background-color: #d9d9d9">
  <div id="modalFitur"></div>
  <header id="header"></header>
  <main class="container">
    <nav class="my-3">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item active fw-semibold" aria-current="page">
          Checkout
        </li>
      </ol>
    </nav>
    <div class="bg-light rounded-4 row d-flex align-items-center mb-3">
      <div class="col-2">
        <img src="public/assets/ayam_pedas.png" alt="" class="w-100" />
      </div>
      <div class="col-10">
        <h2>Ayam spicy</h2>
        <p>
          Ayam goreng renyah dengan saus pedas menggoda. Gurih dan pedasnya
          berpadu sempurna, pas untuk pecinta sensasi pedas yang nagih!
        </p>
        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2 mb-2">
            <button class="btn btn-outline-warning bg-alternativ-color rounded-5 px-4 py-3 btn-sm"
              onclick="increaseQty(this)">
              <span class="text-dark">+</span>
            </button>
            <input type="number"
              class="form-control form-control-sm text-center px-4 py-3 w-25 bg-alternativ-color rounded-5" value="1"
              min="1" />
            <button class="btn btn-outline-warning bg-alternativ-color rounded-5 px-4 py-3 btn-sm"
              onclick="decreaseQty(this)">
              <span class="text-dark">-</span>
            </button>
          </div>
          <span class="text-danger fs-3">Rp. <span class="text-danger " id="harga">14.995</span></span>
        </div>
      </div>
    </div>
    <!-- alamat pengiriman-->
    <div class="bg-light rounded-4 p-2 row mb-3">
      <span class="text-dark col-12 fw-bold">
        <i class="bi bi-geo-alt text-danger"></i>
        Alamat Pengiriman
      </span>
      <form action="#" class="py-4">
        <input type="text" class="bg-light form-control border-0 border-bottom border-2  border-dark rounded-0">
      </form>
    </div>
    <!-- metode pemesanan -->
    <div class="bg-light rounded-4 p-2 row mb-3">
      <span class="text-dark col-12 fw-bold mb-3">
        <i class="bi bi-menu-button-fill text-danger"></i>
        Metode Pemesanan
      </span>
      <div class="col-12 d-flex justify-content-between my-3">
        <div class="d-flex align-items-center  border rounded-4 bg-alternativ-color">
          <img src="public/assets/dineIn.png" class="w-25 me-5" alt="">
          <h3>Dine-In</h1>
        </div>
        <div class="d-flex  ms-4 align-items-center border rounded-4 bg-alternativ-color">
          <img src="public/assets/Delivery.png" class="w-25 me-5" alt="">
          <h3>Delivery</h1>
        </div>
        <div class="d-flex mx-4 align-items-center border rounded-4 bg-alternativ-color">
          <img src="public/assets/takeAway.png" class="w-25 me-5" alt="">
          <h3>Take Away</h1>
        </div>
        <div class="d-flex align-items-center border rounded-4 bg-alternativ-color">
          <img src="public/assets/driveThru.png" class="w-25 me-5" alt="">
          <h3>Drive-Thru</h1>
        </div>
      </div>
    </div>
    <!-- metode pembaayaran -->
    <div class="bg-light rounded-4 p-2 row mb-3">
      <span class="text-dark col-12 fw-bold mb-3">
        <i class="bi bi-credit-card-fill text-danger"></i>
        Metode Pembayaran
      </span>
      <div class="row">
        <div class="col-12 col-md-6">
          <div class="border bg-alternativ-color rounded-4 d-flex align-items-center justify-content-center h-100">
            <img src="public/assets/qris.png" class="d-block mx-auto p-2" alt="">
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="bg-alternativ-color rounded-4 d-flex align-items-center justify-content-center h-100">
            <img src="public/assets/cash.png" style="width: 105px;" class="d-block mx-auto p-2" alt="">
          </div>
        </div>
      </div>
    </div>
    <div class="bg-light rounded-4 p-2 row mb-3">
      <a href="#" data-img="/public/assets/payment-error.png" data-title="Mohon Maaf Pembayaran belum tersedia"
        class="col-12 bg-alternativ-color rounded-4 text-decoration-none text-dark pop-up">
        <h1 class="text-center">Buat pesanan (<span id="harga-total"></span>)</h1>
      </a>
    </div>
  </main>
  <script src="public/js/headerFooter.js"></script>
  <script src="public/js/modalFitur.js"></script>
  <script src="public/js/bootstrap.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
    let hargaSatuan = 14955;

    function updateHarga(totalQty) {
      document.getElementById("harga").textContent = (
        hargaSatuan * totalQty
      ).toLocaleString("id");
    }

    function updateHargaTotal(totalQty) {
      document.getElementById("harga-total").textContent = (
        hargaSatuan * totalQty
      ).toLocaleString("id");
    }

    function decreaseQty(btn) {
      let input = btn.parentNode.querySelector("input");
      let value = parseInt(input.value);

      if (value > 1) {
        input.value = value - 1;
        updateHarga(input.value);
        updateHargaTotal(input.value);
      }
    }

    function increaseQty(btn) {
      let input = btn.parentNode.querySelector("input");
      let value = parseInt(input.value);

      input.value = value + 1;
      updateHarga(input.value);
      updateHargaTotal(input.value);
    }
  </script>
</body>

</html>
